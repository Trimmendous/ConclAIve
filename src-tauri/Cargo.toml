[package]
name = "conclaive"
version = "0.1.0"
description = "ConclAIve: fictional AI specialists that critique prompts and debate each other"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "conclaive"
path = "src/main.rs"
